<html lang="en">
<head>

    <style>
        /* Styles remain the same as the previous version */
        /* Basic Styling */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 0 15px 15px 15px; line-height: 1.6; background-color: #f9f9f9; color: #333; overflow-x: hidden; margin: 0; }

        /* Interactive View Styles */
        #chartContainer, #details { max-width: 850px; margin: 25px auto; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        #detailContent strong { margin-right: 10px; color: #555; }
        #detailsHeader .color-box { display: inline-block; width: 15px; height: 15px; margin-right: 8px; vertical-align: middle; border: 1px solid #ccc; border-radius: 3px; }

        /* Digital Signage View Styles */
        #signageMode { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(44, 62, 80, 0.97); color: #ecf0f1; z-index: 1000; display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 30px; box-sizing: border-box; text-align: center; }

        #signageContent h3 { font-size: 2.0em; color: #f1c40f; margin-bottom: 15px; flex-shrink: 0; }
        #signageContent ul { list-style: none; padding: 0; margin: 0 auto; max-width: 600px; width: 100%; flex-shrink: 0; }
        #signageContent li { background-color: rgba(236, 240, 241, 0.1); padding: 10px 15px; border-radius: 5px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        #signageChartContainer { width: 100%; height: 85%; flex-grow: 1; position: relative; padding: 10px; box-sizing: border-box; }
        #signageChartCanvas { max-height: 100%; max-width: 100%; }
        button#closeSignageBtn { position: absolute; top: 20px; right: 20px; background: #c0392b; color: white; border: none; font-size: 1.5em; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; line-height: 40px; text-align: center; z-index: 1001; }

        /* Data Entry View Styles */
        #entryView { max-width: 700px; margin: 25px auto; background-color: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #entryForm label { display: block; margin: 15px 0 5px 0; font-weight: bold; color: #555; }
        #entryForm input[type="text"], #entryForm input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em; }
        #entryForm .house-score-entry { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 10px; }
        #entryForm .house-score-entry div { margin-bottom: 5px; }
        #entryForm button { display: block; width: 100%; padding: 12px; margin-top: 25px; background-color: #2ecc71; color: white; font-size: 1.1em; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.3s ease; }
        #entryStatus { margin-top: 20px; font-weight: bold; text-align: center; padding: 10px; border-radius: 4px; }
        #entryStatus.success { color: #27ae60; background-color: #eafaf1; border: 1px solid #b8e9d1; }
        #entryStatus.error { color: #c0392b; background-color: #fbecea; border: 1px solid #f5c6cb; }

        .hidden { display: none !important; }

<body>

    <h1>House Competition Totals</h1>
    <div id="loadingIndicator">Loading Database and Application...</div>
    <div id="controls" class="hidden"> <button id="interactiveBtn" data-hash="">Interactive View</button>
        <button id="signageBtn" data-hash="#signage">Digital Signage</button>
        <button id="entryBtn" data-hash="#entry">Enter Scores</button>
    </div>

    <div id="interactiveView" class="view-container">
        <div id="chartContainer"><canvas id="totalScoresChart"></canvas></div>
        <div id="details">
            <h2 id="detailsHeader">Event Details</h2>
            <p id="detailsPrompt">Click a bar above or select an event...</p>
            <div id="detailContent" style="display: none;"></div>
        </div>
    </div>
    <div id="signageMode" class="view-container">
        <button id="closeSignageBtn" title="Exit Signage Mode">X</button>
        <div id="signageContent"><div><h2>Loading Signage...</h2></div></div>
    </div>
    <div id="entryView" class="view-container">
        <h2>Enter New Event Scores</h2>
        <form id="entryForm">
            <div><label for="eventName">Event Name:</label><input type="text" id="eventName" name="eventName" required></div>
            <label>House Scores:</label>
            <div class="house-score-entry" id="houseScoreInputs"></div>
            <div id="entryStatus"></div>
            <button type="submit">Add Event Scores</button>
        </form>
    </div>


    <script>
        // Wrap in anonymous async function to use await at top level
        (async function() {
            console.log("Document ready. Starting initialization.");
            const dbLocalStorageKey = 'houseScoresDB_v1';
            let DB = null;
            let signageInterval = null;
            let currentSignageStage = 0;
            const signageStageDuration = 7000;
            let signageChartInstance = null;
            let interactiveChartInstance = null;
            const interactiveChartCanvas = document.getElementById('totalScoresChart');
            const interactiveChartCtx = interactiveChartCanvas ? interactiveChartCanvas.getContext('2d') : null;

            const houses = ["Enfield", "Griffin", "Pegasus", "Phoenix", "Shenlong", "Sphinx"];
            const houseBackgroundColors = [ 'rgba(46, 204, 113, 0.7)', 'rgba(217, 30, 24, 0.7)', 'rgba(52, 152, 219, 0.7)', 'rgba(243, 156, 18, 0.7)', 'rgba(142, 68, 173, 0.7)', 'rgba(241, 196, 15, 0.7)' ];
            const houseBorderColors = [ 'rgba(39, 174, 96, 1)', 'rgba(192, 57, 43, 1)', 'rgba(41, 128, 185, 1)', 'rgba(230, 126, 34, 1)', 'rgba(155, 89, 182, 1)', 'rgba(241, 196, 15, 1)' ];

            // --- Database Initialization ---
            async function initializeDB() {
                let SQL;
                try {
                    console.log("Initializing sql.js...");
                    // Ensure initSqlJs is available globally or handle potential script load order issues if needed
                    if (typeof initSqlJs !== 'function') {
                         throw new Error("initSqlJs function not found. sql.js library might not be loaded correctly.");
                    }
                    SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}` });
                    console.log("sql.js loaded.");
                } catch (err) {
                    console.error("Failed to load sql.js or WASM:", err);
                    throw new Error("Failed to load database library."); // Re-throw to be caught later
                }

                let storedDbContent = null;
                try {
                    storedDbContent = localStorage.getItem(dbLocalStorageKey);
                } catch (storageError) {
                     console.warn("Could not read from localStorage (maybe disabled or full?):", storageError);
                     // Proceed without stored DB
                }


                if (storedDbContent) {
                    console.log("Attempting to load database from localStorage...");
                    try {
                        const dbData = Uint8Array.from(atob(storedDbContent), c => c.charCodeAt(0));
                        DB = new SQL.Database(dbData);
                        console.log("Database loaded successfully from localStorage.");
                        // Simple validation: Check if tables exist
                        const tableCheck = DB.exec("SELECT name FROM sqlite_master WHERE type='table' AND name IN ('events', 'scores');");
                        if (!tableCheck || tableCheck.length === 0 || tableCheck[0].values.length < 2) {
                             console.warn("Stored database seems corrupted or incomplete. Re-initializing.");
                             localStorage.removeItem(dbLocalStorageKey); // Remove corrupted data
                             DB.close(); // Close the invalid DB object
                             DB = null; // Reset DB variable
                        } else {
                             return true; // Success loading existing DB
                        }
                    } catch (parseError) {
                        console.error("Error parsing stored database. Data might be corrupted:", parseError);
                        localStorage.removeItem(dbLocalStorageKey); // Remove corrupted data
                        DB = null; // Ensure DB is null if loading failed
                         // Fall through to create a new DB
                    }
                }

                // If DB is still null, create a new one
                 if (!DB) {
                    console.log("Creating new database and populating initial data...");
                    try {
                        DB = new SQL.Database();
                        // Create tables
                        DB.run(`CREATE TABLE events (event_id INTEGER PRIMARY KEY AUTOINCREMENT, event_name TEXT UNIQUE NOT NULL);`);
                        DB.run(`CREATE TABLE scores (score_id INTEGER PRIMARY KEY AUTOINCREMENT, event_id INTEGER NOT NULL, house_name TEXT NOT NULL, points INTEGER NOT NULL, FOREIGN KEY (event_id) REFERENCES events (event_id));`);
                        console.log("Tables created.");

                        // Initial Data (Corrected)
                        const initialData = [ { event: "Advisory Games", Enfield: 34, Griffin: 28, Pegasus: 44, Phoenix: 57, Shenlong: 37, Sphinx: 65 }, /* ... other events ... */ { event: "August Color Day", Enfield: 57, Griffin: 40, Pegasus: 49, Phoenix: 63, Shenlong: 31, Sphinx: 36 }, { event: "Trachten Tag Spirit Day", Enfield: 34, Griffin: 23, Pegasus: 25, Phoenix: 33, Shenlong: 22, Sphinx: 25 }, { event: "G6 Trash Colllection", Enfield: 0, Griffin: 0, Pegasus: 10, Phoenix: 0, Shenlong: 10, Sphinx: 5 }, { event: "Sept/Oct Literacy Challenge", Enfield: 10, Griffin: 10, Pegasus: 10, Phoenix: 10, Shenlong: 10, Sphinx: 0 }, { event: "Halloween Spirit Day", Enfield: 48, Griffin: 51, Pegasus: 56, Phoenix: 49, Shenlong: 40, Sphinx: 50 }, { event: "Fall Photo Challenge", Enfield: 40, Griffin: 5, Pegasus: 30, Phoenix: 40, Shenlong: 10, Sphinx: 10 }, { event: "Odd Socks Day", Enfield: 22, Griffin: 32, Pegasus: 23, Phoenix: 30, Shenlong: 31, Sphinx: 23 }, { event: "Chess Tournament", Enfield: 6, Griffin: 2, Pegasus: 4, Phoenix: 2, Shenlong: 5, Sphinx: 18 }, { event: "PJ & Onesie Spirit Day", Enfield: 34, Griffin: 33, Pegasus: 29, Phoenix: 29, Shenlong: 28, Sphinx: 32 }, { event: "Can Food Drive", Enfield: 38, Griffin: 18, Pegasus: 6, Phoenix: 36, Shenlong: 20, Sphinx: 16 }, { event: "Wacky Winter Spirit Day", Enfield: 36, Griffin: 39, Pegasus: 36, Phoenix: 35, Shenlong: 37, Sphinx: 31 }, { event: "Paper Snowflake Challenge", Enfield: 20, Griffin: 11, Pegasus: 10, Phoenix: 11, Shenlong: 4, Sphinx: 15 }, { event: "Spirit Week - Accessories", Enfield: 30, Griffin: 28, Pegasus: 29, Phoenix: 26, Shenlong: 26, Sphinx: 24 }, { event: "Spirit Week - House Colors", Enfield: 46, Griffin: 35, Pegasus: 44, Phoenix: 37, Shenlong: 30, Sphinx: 51 }, { event: "Spirit Week - Writing Challenge", Enfield: 12, Griffin: 16, Pegasus: 8, Phoenix: 6, Shenlong: 12, Sphinx: 12 }, { event: "Spirit Week - Back to the Future", Enfield: 21, Griffin: 16, Pegasus: 7, Phoenix: 21, Shenlong: 14, Sphinx: 11 }, { event: "Spirit Week - Mandala Coloring", Enfield: 14, Griffin: 14, Pegasus: 14, Phoenix: 14, Shenlong: 24, Sphinx: 20 }, { event: "Spirit Week - Mixed Patterns", Enfield: 16, Griffin: 21, Pegasus: 24, Phoenix: 20, Shenlong: 23, Sphinx: 19 }, { event: "Spirit Week - Twin Day", Enfield: 57, Griffin: 41, Pegasus: 44, Phoenix: 58, Shenlong: 46, Sphinx: 48 }, { event: "Hola Hoop Challenge", Enfield: 0, Griffin: 0, Pegasus: 0, Phoenix: 0, Shenlong: 30, Sphinx: 0 }, { event: "Pink Day", Enfield: 34, Griffin: 43, Pegasus: 44, Phoenix: 37, Shenlong: 35, Sphinx: 36 }, { event: "Fasching", Enfield: 19, Griffin: 35, Pegasus: 28, Phoenix: 23, Shenlong: 22, Sphinx: 22 }, { event: "Pi Day", Enfield: 12, Griffin: 27, Pegasus: 5, Phoenix: 37, Shenlong: 11, Sphinx: 20 }, { event: "Literacy Month Read-a-Louds", Enfield: 77, Griffin: 49, Pegasus: 74, Phoenix: 72, Shenlong: 54, Sphinx: 55 }, { event: "Literacy Month Share a Book", Enfield: 17, Griffin: 12, Pegasus: 7, Phoenix: 11, Shenlong: 10, Sphinx: 10 }, { event: "Literacy Month Diorama, Read-a-Th", Enfield: 2, Griffin: 5, Pegasus: 4, Phoenix: 5, Shenlong: 2, Sphinx: 7 }, { event: "Waldo/Wally Game", Enfield: 10, Griffin: 9, Pegasus: 13, Phoenix: 15, Shenlong: 16, Sphinx: 16 }, { event: "Character Day", Enfield: 21, Griffin: 19, Pegasus: 21, Phoenix: 18, Shenlong: 20, Sphinx: 19 }, { event: "Advisory Team Photo Race", Enfield: 20, Griffin: 10, Pegasus: 5, Phoenix: 50, Shenlong: 40, Sphinx: 30 }, { event: "Earth Day Trash Race", Enfield: 20, Griffin: 25, Pegasus: 15, Phoenix: 30, Shenlong: 5, Sphinx: 10 } ];

                        DB.exec("BEGIN TRANSACTION;");
                        let eventStmt = null; let scoreStmt = null;
                        try {
                            eventStmt = DB.prepare("INSERT INTO events (event_name) VALUES (?)");
                            scoreStmt = DB.prepare("INSERT INTO scores (event_id, house_name, points) VALUES (?, ?, ?)");
                            initialData.forEach(eventData => {
                                try {
                                    eventStmt.bind([eventData.event]);
                                    eventStmt.step(); // Execute statement
                                    const eventId = DB.exec("SELECT last_insert_rowid();")[0].values[0][0];
                                    eventStmt.reset(); // Reset for next use
                                    houses.forEach(house => {
                                        scoreStmt.run([eventId, house, eventData[house] !== undefined ? eventData[house] : 0]);
                                    });
                                } catch (innerError) {
                                    console.warn(`Skipping initial data for event '${eventData.event}' due to error:`, innerError.message);
                                    if (eventStmt) eventStmt.reset(); // Ensure reset even on error
                                    // Don't break the whole transaction, just skip this event
                                }
                            });
                            DB.exec("COMMIT;");
                            console.log("Initial data populated.");
                            saveDBToLocalStorage(); // Save the newly created DB
                            return true; // Success creating new DB
                        } catch (transError) {
                             console.error("Error during initial data transaction:", transError);
                             DB.exec("ROLLBACK;");
                             throw new Error("Failed to populate initial database data."); // Propagate error
                        } finally {
                             if (eventStmt) eventStmt.free(); // Free statements
                             if (scoreStmt) scoreStmt.free();
                        }
                    } catch (creationError) {
                         console.error("Error creating new database:", creationError);
                         if (DB) DB.close(); // Close DB if creation failed partially
                         DB = null;
                         throw new Error("Failed to create new database."); // Propagate error
                    }
                 }
                return false; // Should not be reached if logic is correct, indicates an issue
            }

            function saveDBToLocalStorage() { /* ... same ... */
                if (!DB) return; try { const dbData = DB.export(); const base64Data = btoa(String.fromCharCode.apply(null, dbData)); localStorage.setItem(dbLocalStorageKey, base64Data); console.log("Database saved to localStorage."); } catch (error) { console.error("Error saving database to localStorage:", error); }
            }

            // --- Data Retrieval Functions (Assume DB is initialized) ---
            function getHouseTotalsFromDB() { /* ... same ... */
                if (!DB) return {}; const r = DB.exec("SELECT house_name, SUM(points) as total_score FROM scores GROUP BY house_name"); const t = {}; if (r.length > 0) { r[0].values.forEach(row => { t[row[0]] = row[1]; }); } houses.forEach(h => { if (!(h in t)) t[h] = 0; }); return t;
            }
            function getLeaderboardFromDB() { /* ... same ... */
                const t = getHouseTotalsFromDB(); return houses.map((h, i) => ({ name: h, score: t[h] || 0, color: houseBackgroundColors[i] })).sort((a, b) => b.score - a.score);
            }
             function getEventScoresFromDB(eventName) { /* ... same ... */
                 if (!DB) return null; try { const er = DB.exec("SELECT event_id FROM events WHERE event_name = ?", [eventName]); if (er.length === 0 || er[0].values.length === 0) return null; const eid = er[0].values[0][0]; const sr = DB.exec("SELECT house_name, points FROM scores WHERE event_id = ?", [eid]); const s = {}; if (sr.length > 0) { sr[0].values.forEach(row => { s[row[0]] = row[1]; }); } houses.forEach(h => { if (!(h in s)) s[h] = 0; }); return s; } catch (e) { console.error(`Error getting scores for event ${eventName}:`, e); return null; }
             }
            function getAllEventDetailsFromDB() { /* ... same ... */
                if (!DB) return []; try { const r = DB.exec(`SELECT e.event_name, s.house_name, s.points FROM events e JOIN scores s ON e.event_id = s.event_id ORDER BY e.event_name, s.house_name;`); const d = {}; if (r.length > 0) { r[0].values.forEach(row => { const [en, hn, p] = row; if (!d[en]) { d[en] = { event: en }; houses.forEach(h => { d[en][h] = 0; }); } d[en][hn] = p; }); } return Object.values(d); } catch(e) { console.error("Error getting all event details:", e); return []; }
            }

            // --- Chart / Signage / Details Functions (Assume DB is ready) ---
            function initInteractiveChart() { /* ... same as before, relies on getHouseTotalsFromDB ... */
                if (!interactiveChartCtx) return; if (interactiveChartInstance) { interactiveChartInstance.destroy(); } const hT = getHouseTotalsFromDB(); const tS = houses.map(h => hT[h] || 0); interactiveChartInstance = new Chart(interactiveChartCtx, { type: 'bar', data: { labels: houses, datasets: [{ label: 'Total Score', data: tS, backgroundColor: houseBackgroundColors, borderColor: houseBorderColors, borderWidth: 1.5, hoverBackgroundColor: houseBorderColors }] }, options: { responsive: true, maintainAspectRatio: true, indexAxis: 'x', animation: { duration: 500 }, scales: { y: { beginAtZero: true, title: { display: true, text: 'Total Points', font: { size: 14 } } }, x: { title: { display: true, text: 'House', font: { size: 14 } } } }, plugins: { legend: { display: false }, title: { display: true, text: 'Total Scores per House', font: { size: 18 }, padding: { top: 10, bottom: 20 } }, tooltip: { callbacks: { label: function(c){let l=c.dataset.label||'';if(l){l+=': '}if(c.parsed.y!==null){l+=c.parsed.y+' points'}return l;}, title: function(c){return c[0].label;} } } }, onClick: (e, els) => { if (!els.length) return; const i = els[0].index; const h = houses[i]; displayInteractiveDetails(h); $('html, body').animate({ scrollTop: $("#details").offset().top - 20 }, 500); } } });
            }
             function displayInteractiveDetails(houseName) { /* ... same as before, relies on getAllEventDetailsFromDB ... */
                 const allEventDetails = getAllEventDetailsFromDB(); const detailsHeader = $('#detailsHeader'); const detailContent = $('#detailContent'); const detailsPrompt = $('#detailsPrompt'); const houseIndex = houses.indexOf(houseName); const selectedHouseColor = houseIndex !== -1 ? houseBackgroundColors[houseIndex] : '#ccc'; let htmlContent = '<ul>'; allEventDetails.forEach(item => { const score = item[houseName] !== undefined ? item[houseName] : 0; htmlContent += `<li><span>${item.event}:</span> <strong>${score} pts</strong></li>`; }); htmlContent += '</ul>'; detailContent.stop(true, true).fadeOut(300, function() { detailsHeader.html(`<span class="color-box" style="background-color: ${selectedHouseColor};"></span> Event Scores for ${houseName}`); detailsPrompt.hide(); $(this).html(htmlContent); $(this).fadeIn(400); });
             }
             function getSignageEventData(eventName) { /* ... same as before, relies on getEventScoresFromDB ... */
                  const scoresObj = getEventScoresFromDB(eventName); if (!scoresObj) return null; return houses.map((h, i) => ({ name: h, score: scoresObj[h] || 0, color: houseBackgroundColors[i] })).sort((a, b) => b.score - a.score);
             }
            function updateSignageView() { /* ... same as before, relies on getLeaderboardFromDB, getSignageEventData, getHouseTotalsFromDB ... */
                 const leaderboard = getLeaderboardFromDB(); const signageStages = [ { type: 'leaderboard', title: "Overall Standings" }, { type: 'chart', title: "Overall Scores Chart" }, { type: 'focus_house', rank: 1, title: "Current Leader" }, { type: 'focus_house', rank: 2, title: "Runner Up" }, { type: 'event', eventName: "Advisory Games", title: "Event: Advisory Games" }, { type: 'event', eventName: "Literacy Month Read-a-Louds", title: "Event: Read-a-Louds" } ]; const stage = signageStages[currentSignageStage]; let contentHtml = `<div id="signageSlideContent">`; switch (stage.type) { case 'leaderboard': contentHtml += `<h2>${stage.title}</h2><ul>`; leaderboard.forEach((h, i) => { contentHtml += `<li style="border-left: 5px solid ${h.color};"><span class="house-name">${i + 1}. ${h.name}</span> <span class="house-score">${h.score} pts</span></li>`; }); contentHtml += `</ul>`; break; case 'focus_house': const hF = leaderboard[stage.rank - 1]; contentHtml += `<h2>${stage.title}</h2>`; if (hF) { contentHtml += `<h3 style="color: ${hF.color};">${hF.name}</h3><p style="font-size: 4em; font-weight: bold; color: ${hF.color}; margin-top: 10px;">${hF.score} <span style="font-size: 0.5em; color: #ecf0f1;">Points</span></p>`; } else { contentHtml += `<p>Data unavailable.</p>`; } break; case 'event': const eS = getSignageEventData(stage.eventName); contentHtml += `<h2>${stage.title}</h2>`; if (eS) { contentHtml += `<ul class="event-score-list">`; eS.slice(0, 5).forEach(item => { if (item.score > 0) { contentHtml += `<li style="border-left: 3px solid ${item.color};"><span class="house-name">${item.name}</span> <span class="house-score">${item.score} pts</span></li>`; } }); contentHtml += `</ul>`; } else { contentHtml += `<p>Event data not found.</p>`; } break; case 'chart': contentHtml += `<h2>${stage.title}</h2><div id="signageChartContainer"><canvas id="signageChartCanvas"></canvas></div>`; break; } contentHtml += `</div>`; const sCD = $('#signageContent'); sCD.stop(true, true).fadeOut(500, function() { if (signageChartInstance) { signageChartInstance.destroy(); signageChartInstance = null; } $(this).html(contentHtml); $(this).fadeIn(500, function() { if (stage.type === 'chart') { const sCtx = document.getElementById('signageChartCanvas')?.getContext('2d'); if (sCtx) { const hTs = getHouseTotalsFromDB(); const tSs = houses.map(h => hTs[h] || 0); const sOpts = { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { color: '#ecf0f1', font: { size: 14 } }, grid: { color: 'rgba(236, 240, 241, 0.2)' }, title: { display: true, text: 'Points', color: '#ecf0f1' } }, x: { ticks: { color: '#ecf0f1', font: { size: 14 } }, grid: { display: false }, title: { display: true, text: 'House', color: '#ecf0f1' } } }, plugins: { legend: { display: false }, title: { display: false }, tooltip: { enabled: false } }, animation: { duration: 600 } }; signageChartInstance = new Chart(sCtx, { type: 'bar', data: { labels: houses, datasets: [{ label: 'Total Score', data: tSs, backgroundColor: houseBackgroundColors, borderColor: houseBorderColors, borderWidth: 1 }] }, options: sOpts }); } } }); }); currentSignageStage = (currentSignageStage + 1) % signageStages.length;
             }
            function startSignageCycle() { /* ... same ... */ if (signageInterval) clearInterval(signageInterval); console.log("Starting signage cycle"); currentSignageStage = 0; updateSignageView(); signageInterval = setInterval(updateSignageView, signageStageDuration); }
            function stopSignageCycle() { /* ... same ... */ console.log("Stopping signage cycle"); clearInterval(signageInterval); signageInterval = null; if (signageChartInstance) { console.log("Destroying signage chart instance on stop."); signageChartInstance.destroy(); signageChartInstance = null; } }

            // --- Data Entry Functions ---
            function setupEntryForm() { /* ... same ... */ const c = $('#houseScoreInputs'); c.empty(); houses.forEach(h => { c.append(`<div><label for="score_${h}">${h}:</label><input type="number" id="score_${h}" name="score_${h}" required min="0" value="0"></div>`); }); }
            function addEventToDB(eventName, scores) { /* ... same robust version ... */
                 if (!DB) { console.error("DB not initialized!"); return false; } try { DB.exec("BEGIN TRANSACTION;"); let eventId; const eventCheck = DB.exec("SELECT event_id FROM events WHERE event_name = ?", [eventName]); if (eventCheck.length > 0 && eventCheck[0].values.length > 0) { console.warn(`Event "${eventName}" already exists. Aborting add.`); DB.exec("ROLLBACK;"); setEntryStatus(`Event "${eventName}" already exists.`, 'error'); return false; } else { DB.run("INSERT INTO events (event_name) VALUES (?)", [eventName]); eventId = DB.exec("SELECT last_insert_rowid();")[0].values[0][0]; } const scoreStmt = DB.prepare("INSERT INTO scores (event_id, house_name, points) VALUES (?, ?, ?)"); Object.entries(scores).forEach(([h, p]) => { scoreStmt.run([eventId, h, p]); }); scoreStmt.free(); DB.exec("COMMIT;"); console.log(`Event "${eventName}" and scores added successfully.`); saveDBToLocalStorage(); return true; } catch (e) { console.error("Error adding event to DB:", e); DB.exec("ROLLBACK;"); return false; }
            }
            function setEntryStatus(message, type = 'success') { /* ... same ... */ $('#entryStatus').text(message).removeClass('success error').addClass(type).slideDown(); setTimeout(() => $('#entryStatus').slideUp(), 5000); }

            // --- Mode Activation / Deactivation ---
            function activateView(hash) { /* ... same ... */
                 if (!DB) return; /* Prevent activation if DB not ready */ if (signageInterval) stopSignageCycle(); $('.view-container').removeClass('active'); $('#controls button').removeClass('active'); switch (hash) { case '#signage': $('#signageMode').addClass('active').css('display', 'flex'); $('#signageBtn').addClass('active'); startSignageCycle(); break; case '#entry': $('#entryView').addClass('active'); $('#entryBtn').addClass('active'); setupEntryForm(); break; case '': default: $('#interactiveView').addClass('active'); $('#interactiveBtn').addClass('active'); $('#chartContainer, #details').show(); initInteractiveChart(); $('#detailsPrompt').show(); $('#detailContent').hide(); $('#detailsHeader').text('Event Details'); break; }
             }

            // --- Hash Handling ---
            function handleHashChange() { if (!DB) { console.warn("DB not ready, delaying hash change handling."); return; } const hash = window.location.hash; activateView(hash); }

            // --- Event Listeners ---
            $('#controls button').on('click', function() { const targetHash = $(this).data('hash'); if (window.location.hash !== targetHash) { window.location.hash = targetHash; } }); // Avoid redundant hash changes
            $('#closeSignageBtn').on('click', function() { window.location.hash = ''; });
            $('#entryForm').on('submit', function(event) { /* ... same validation and call to addEventToDB ... */ event.preventDefault(); const eventName = $('#eventName').val().trim(); const scores = {}; let isValid = true; $('input[id^="score_"]').css('border-color',''); /* Clear previous errors */ houses.forEach(h => { const sVal = $(`#score_${h}`).val(); const sNum = parseInt(sVal, 10); if (sVal === '' || isNaN(sNum) || sNum < 0) { isValid = false; $(`#score_${h}`).css('border-color','red'); } else { scores[h] = sNum; } }); if (!eventName) { isValid = false; $('#eventName').css('border-color','red'); } else {$('#eventName').css('border-color','');} if (!isValid) { setEntryStatus('Please enter a valid event name and non-negative scores for all houses.', 'error'); return; } $('#entryStatus').empty().hide(); const success = addEventToDB(eventName, scores); if (success) { setEntryStatus(`Event "${eventName}" added successfully!`, 'success'); $('#entryForm')[0].reset(); /* Optionally navigate away: window.location.hash = ''; */ } else { setEntryStatus('Failed to add event. Event might already exist or DB error occurred.', 'error'); } });
            $(window).on('hashchange', handleHashChange);

            // --- Initial Load ---
            try {
                const dbReady = await initializeDB(); // Wait for DB
                if (dbReady && DB) { // Ensure DB object is set
                     $('#loadingIndicator').hide();
                     $('#controls').removeClass('hidden'); // Show controls
                     handleHashChange(); // Set initial view based on hash AFTER DB is ready
                } else {
                     throw new Error("Database initialization failed silently or DB object not set."); // Throw error if DB isn't ready
                }
            } catch (e) {
                console.error("FATAL ERROR during initial setup:", e);
                $('#loadingIndicator').text(`ERROR: ${e.message}. Cannot start application. Check console.`).addClass('error');
                // Hide controls if setup failed
                $('#controls').addClass('hidden');
            }

        })(); // End of async IIFE wrapper
    </script>

</body>
